# SugarRush settings. Accounts, restaurants and menus live in the Firebase Realtime Database;
# there is no seed data.
firebase.projectId=soen343-f701c

# Pricing rules (R-PRC-01): every fare is computed from these values.
pricing.deliveryFee=3.00
pricing.serviceFee=1.00
pricing.smallOrderThreshold=15.00
pricing.smallOrderSurcharge=2.00

# Map: x/y are kilometres east/north of this origin (downtown Montreal). Distances stay straight-line (R-DLV-02).
map.originLatitude=45.5017
map.originLongitude=-73.5673
# Accelerated courier travel for the demo; 0 turns the travel simulation off.
simulation.courierKmPerSecond=0.15
