# Local demo accounts required by the seed loader. App users sign in with Firebase.
users=customer,restaurant,courier,operator
user.customer.username=customer
user.customer.password=customer-demo
user.customer.role=CUSTOMER
user.restaurant.username=restaurant
user.restaurant.password=restaurant-demo
user.restaurant.role=RESTAURANT
user.courier.username=courier
user.courier.password=courier-demo
user.courier.role=COURIER
user.operator.username=operator
user.operator.password=operator-demo
user.operator.role=OPERATOR

# Restaurants are created by signed-in owners and stored in backend/data/restaurants.properties.
restaurants=
